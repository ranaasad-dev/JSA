<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>JSA Admin - Reset password</title>
  <link rel="stylesheet" href="admin.css">
  <script defer src="../assets/vendor/supabase.js"></script>
  <script defer src="../assets/js/supabase-config.js"></script>
  <style>body{padding:2rem}.recovery{max-width:32rem;margin:4rem auto;padding:2rem;border:1px solid #cbd5e1;border-radius:1rem;background:white;color:#102d40;font-family:system-ui,sans-serif}.recovery label{display:block;margin:1rem 0}.recovery input{display:block;width:100%;box-sizing:border-box;padding:.8rem;margin-top:.4rem}.recovery button{padding:.8rem 1rem;cursor:pointer}.recovery p{line-height:1.6}</style>
</head>
<body>
  <main class="recovery">
    <h1>Admin password reset</h1>
    <p id="message" role="status">Recovery link check ho raha hai...</p>
    <form id="form" hidden>
      <label>Naya password <input id="password" type="password" minlength="8" autocomplete="new-password" required></label>
      <label>Dobara password likhein <input id="confirm" type="password" minlength="8" autocomplete="new-password" required></label>
      <button id="save" type="submit">Save new password</button>
    </form>
    <p><a href="./">Admin login par wapas jayein</a></p>
  </main>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      const msg = document.getElementById('message');
      const form = document.getElementById('form');
      const button = document.getElementById('save');
      const fragment = new URLSearchParams(location.hash.slice(1));
      const isRecovery = fragment.get('type') === 'recovery';
      if (!isRecovery) {
        msg.textContent = 'Recovery link nahi mila ya expire ho gaya. Supabase se naya password recovery email bhejein.';
        return;
      }
      try {
        const client = supabase.createClient(JSA_CONFIG.url, JSA_CONFIG.key, {
          auth: { storage: sessionStorage, storageKey: 'jsa-password-recovery', detectSessionInUrl: true }
        });
        const { data, error } = await client.auth.getSession();
        if (error || !data.session) throw new Error('Recovery link expire ya invalid hai. Naya email bhejein.');
        if (data.session.user.id !== JSA_CONFIG.adminId) {
          await client.auth.signOut();
          throw new Error('Yeh account Main Admin nahi hai.');
        }
        msg.textContent = 'Apna naya password likhein.';
        form.hidden = false;
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const password = document.getElementById('password').value;
          if (password !== document.getElementById('confirm').value) {
            msg.textContent = 'Dono passwords same nahi hain.';
            return;
          }
          button.disabled = true;
          const result = await client.auth.updateUser({ password });
          if (result.error) {
            msg.textContent = 'Password change nahi hua: ' + result.error.message;
            button.disabled = false;
            return;
          }
          form.reset();
          form.hidden = true;
          msg.textContent = 'Password change ho gaya. Ab admin login par jayein.';
          await client.auth.signOut();
        });
      } catch (error) {
        msg.textContent = error.message || 'Recovery page load nahi hua.';
      }
    });
  </script>
</body>
</html>
